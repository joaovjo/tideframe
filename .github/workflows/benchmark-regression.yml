name: Benchmark Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Benchmark stability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Run benchmark
        run: bun run bench | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-results
          path: benchmark.txt
